name: 社群模板審核與自動發布

# 2026-08-24 功能：投稿建立時自動驗證；只有具寫入權限的管理者加 approved-template 標籤後才發布。
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: community-template-publish
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.action == 'opened' &&
      startsWith(github.event.issue.title, '[模板投稿]')
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 驗證投稿 ZIP
        id: validation
        continue-on-error: true
        run: >-
          python scripts/publish_template_submission.py
          --event "$GITHUB_EVENT_PATH"
          --repo-root .
          --mode validate
          --report-file submission_report.md

      - name: 回覆驗證結果
        if: always()
        uses: actions/github-script@v7
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('submission_report.md')
              ? fs.readFileSync('submission_report.md', 'utf8')
              : '❌ 投稿驗證未產生報告，請管理者查看 Actions 記錄。';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            if (process.env.VALIDATION_OUTCOME === 'success') {
              const labels = [
                {name: 'approved-template', color: '0E8A16', description: '管理者核准後自動公開模板'},
                {name: 'template-validation-passed', color: '1D76DB', description: '模板投稿自動驗證通過'},
              ];
              for (const label of labels) {
                try {
                  await github.rest.issues.getLabel({owner: context.repo.owner, repo: context.repo.repo, name: label.name});
                } catch (error) {
                  if (error.status !== 404) throw error;
                  await github.rest.issues.createLabel({owner: context.repo.owner, repo: context.repo.repo, ...label});
                }
              }
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['template-validation-passed'],
              });
            }

      - name: 標記驗證失敗
        if: steps.validation.outcome != 'success'
        run: exit 1

  publish:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'approved-template' &&
      startsWith(github.event.issue.title, '[模板投稿]')
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 驗證核准者權限
        id: permission
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            const allowed = ['admin', 'maintain', 'write'].includes(response.data.permission);
            if (!allowed) {
              core.setFailed(`使用者 ${context.actor} 沒有模板發布權限。`);
            }
            return allowed;

      - name: 重新驗證並準備發布
        run: >-
          python scripts/publish_template_submission.py
          --event "$GITHUB_EVENT_PATH"
          --repo-root .
          --mode publish
          --report-file submission_report.md

      - name: 提交正式模板與完整索引
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json templates/*.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "publish approved community templates from issue #${{ github.event.issue.number }}"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 回覆發布結果並關閉投稿
        uses: actions/github-script@v7
        env:
          CHANGED: ${{ steps.commit.outputs.changed }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('submission_report.md', 'utf8');
            const suffix = process.env.CHANGED === 'true'
              ? '\n✅ 已提交至 main；其他使用者啟動程式後即可取得模板更新。'
              : '\nℹ️ 線上模板內容已相同，無需重複提交。';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report + suffix,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });
