services:
  - type: web
    name: cpa-license-broker
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn broker_server_fastapi:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: ALLOWLIST
        value: ""         # 以逗號分隔的 device_id
      - key: DEFAULT_PLAN
        value: "FREE"
      - key: DEFAULT_EXPIRE
        value: "2099-12-31"
      - key: TTL_SECONDS
        value: "1800"
